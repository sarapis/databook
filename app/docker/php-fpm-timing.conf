; Per-request timing for php-fpm (loaded after www.conf; the zz- prefix sorts last).
;
; ⚠ Why: on 2026-09-23 php-fpm hit pm.max_children (15) every 2-3 minutes under
; the /research/ crawler, and nothing recorded WHICH requests held the workers or
; for how long. nginx logs no timings and the default fpm access line is
; `"GET /index.php" 200`, which names neither the page nor the duration.
;
; access.format adds the real URI (REQUEST_URI, not the front controller), the
; wall time in milliseconds, CPU % and peak memory. %{mili}d and %C are measured
; by fpm itself, so they include time spent waiting on the API.
[www]
access.format = "fpm %t \"%m %{REQUEST_URI}e\" %s %{mili}dms cpu=%C%% mem=%{kilo}MKB"

; Any request slower than this logs a WARNING naming the script and request
; ("executing too slow (3.79 sec)"). 3s is well above a normal page (0.1-0.3s
; measured) and below the 5s API timeout in DatabookAPI::req().
; ⚠ The STACK TRACE part does not work, deliberately: fpm needs ptrace for it,
; Docker withholds SYS_PTRACE by default, and each slow request therefore also
; logs `ERROR: failed to ptrace(ATTACH) child N: Operation not permitted`. That
; ERROR is expected noise, not a fault. Granting SYS_PTRACE would widen the
; container's privileges for a trace the access log above mostly makes
; unnecessary; do that only as a deliberate decision.
request_slowlog_timeout = 3s
slowlog = /proc/self/fd/2
