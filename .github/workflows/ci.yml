name: CI

on:
  push:
    branches: [main]
    # ⚠ WRITTEN OUT TWICE ON PURPOSE — DO NOT "TIDY" THIS INTO A YAML ANCHOR.
    # GitHub's workflow parser does not support anchors/aliases, so `&docs_only`
    # / `*docs_only` is valid YAML that GitHub rejects. The duplication is pinned
    # by api/tests/test_ci_paths_ignore.py so the two lists cannot drift.
    paths-ignore:
      # ⚠⚠ DOCS-ONLY CHANGES DO NOT NEED A DOCKER BUILD. Added 2026-08-26 after
      # the repo exhausted its Actions allowance mid-month: measured 293 runs in
      # August at ~5.1 min wall each, and because three jobs run in parallel the
      # billed total lands around 3,300-4,500 minutes against the 2,000 included
      # on `wegovnyc`'s FREE plan. On one day alone, 4 of 6 PRs were docs- or
      # handoff-only and every one of them still built images and booted the full
      # stack.
      #
      # ⚠ GitHub skips the run only when EVERY changed file matches, so a PR
      # touching code *and* docs still runs in full. That is the property that
      # makes this safe rather than a coverage hole — and the #280 lesson ("a job
      # you always see skipping is not coverage") is why the list stays this
      # narrow: prose and planning notes, nothing that can change behaviour.
      #
      # ⚠ Safe here specifically because this repo has NO required status checks
      # (branch protection needs Pro/Team; `wegovnyc` is on Free). If the repo
      # moves to the `sarapis` org and gains branch protection, revisit: a
      # REQUIRED check that never runs leaves a PR unmergeable forever.
      - 'docs/**'
      - 'handoffs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    # Must stay identical to the push list above — guard-pinned.
    paths-ignore:
      - 'docs/**'
      - 'handoffs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:   # allow manually running prod-smoke on demand

jobs:
  # ── Job 1: Pytest unit tests (no DB required) ───────────────
  api-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: |
          pip install -r dependencies
          pip install pytest pytest-asyncio httpx
      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  # ── Job 2: Ephemeral full-stack smoke (replaces the staging deploy) ──
  # Builds + boots the real stack in the runner and checks it comes up.
  # No always-on box, no drift — tests the actual build per push/PR.
  integration-smoke:
    name: Integration Smoke (ephemeral stack)
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
        # No submodules needed — this smoke builds only api/app/nginx/postgres/redis
        # (normalizer-py is a separate private submodule).
      - name: Stub gitignored config the stack needs (CI only)
        run: |
          # api/env.yaml is gitignored (holds real creds); without it the bind
          # mount becomes a directory and the api crashes. Use the committed
          # non-secret CI fixture (db creds match the compose postgres defaults).
          cp api/env.ci.yaml api/env.yaml
          # Production splits Postgres into least-privilege roles, so the compose
          # file demands the per-role usernames explicitly rather than defaulting
          # to the superuser. Compose interpolates the BASE file before merging
          # docker-compose.local.yml, so an override cannot supply these — they
          # have to exist as variables. Mirrors .env.example.
          cp .env.example .env
          # ⚠⚠ THE APP HAS THE SAME TRAP AS api/env.yaml ABOVE, AND NOBODY
          # APPLIED IT. docker-compose.yml bind-mounts ./app/.env, which is
          # gitignored, so without this Docker creates a DIRECTORY at
          # /var/www/.env and Laravel cannot read its config. Measured
          # 2026-09-09: all 68 page families returned 500 in CI, including
          # /about and /styleguide which need no data — the frontend had never
          # rendered here, and the smoke printed its status without asserting
          # it.
          #
          # ⚠ .env.example, never .env.default — sync-public.sh excludes the
          # latter because it "carried a live APP_KEY and Carto key".
          cp app/.env.example app/.env
          # ⚠ Its APP_KEY is BLANK (spaces and a comment), which 500s Laravel on
          # its own with "No application encryption key has been specified". A
          # fresh random key per run, read at RUNTIME from the bind-mounted
          # app/.env (the image carries no .env and caches no config) — and so
          # nothing key-shaped is committed to the workflow.
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(head -c 32 /dev/urandom | base64)|" app/.env
          # APP_URL drives asset() and would otherwise point this stack's assets
          # at staging.databook.nyc — the documented throwaway-container trap.
          sed -i "s|^APP_URL=.*|APP_URL=http://localhost:8580|" app/.env
      - name: Build + boot stack (local compose override)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build postgres redis api app nginx
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8581/health >/dev/null 2>&1; then echo "API up"; exit 0; fi
            sleep 3
          done
          echo "::error::API did not become healthy"; docker compose logs api | tail -50; exit 1
      - name: Smoke-check endpoints boot (build/import/config regressions)
        run: |
          set -e
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          echo "api /health:  $(code http://localhost:8581/health)"
          echo "api /docs:    $(code http://localhost:8581/docs)"
          echo "frontend /:   $(code http://localhost:8580/)"
          test "$(code http://localhost:8581/health)" = "200"
          test "$(code http://localhost:8581/docs)"   = "200"
          # NOTE: data-dependent endpoints aren't asserted here — no seed loaded.
          # Load a fixture (scripts/make-local-seed.sh output) to extend this.
      - name: Frontend page families (baseline diff, needs no seed)
        run: |
          set -e
          # Every page family web.php routes, swept and compared against a
          # committed baseline. It is a DIFF, not a list of expected 200s:
          # on this empty database a page that 500s from missing data is
          # byte-identical to one broken by a code change, so the assertion is
          # "nothing moved" rather than "everything is 200".
          #
          # This is the check that makes the Laravel 13 / PHP 8.4 migration in
          # issue #382 verifiable — a route that stops resolving, a view that
          # stops compiling or a class that stops loading all move a status.
          ./scripts/frontend-smoke.sh
      - name: Blade views compile (needs no seed)
        run: |
          set -e
          # ⚠⚠ `php -l` ON A BLADE FILE PROVES NOTHING — it is valid PHP either
          # way, so a view that 500s on every request passes it. This COMPILES
          # all 142 views through the app's own vendored BladeCompiler and lints
          # the output, which is the only thing that sees a directive glued to a
          # word character or an `@php` inside a comment pairing with the next
          # real `@endphp`. Both have shipped a 500 here.
          # ⚠ The frontend baseline above cannot cover this: a view that fails to
          # compile 500s, and on this empty database several pages 500 for data
          # reasons, so "nothing moved" is satisfied by a broken view.
          # ⚠ `scripts/` is not in the app image (its build context is `app/`),
          # so the script is copied in rather than exec'd from the repo path.
          docker compose cp scripts/blade-lint.php app:/tmp/blade-lint.php
          docker compose exec -T app php /tmp/blade-lint.php
      - name: Federated search SQL parses (needs no seed)
        run: |
          set -e
          # Every /get/search group runs against the EMPTY database in this job,
          # which is exactly what makes this assertable without a fixture:
          # Postgres PARSES before it resolves names, so a malformed query still
          # raises 42601 (syntax_error) while a merely-absent table raises 42P01.
          # routers/search.py logs the first at ERROR and the second at WARNING,
          # so an ERROR line from routers.search means SQL that can never work.
          #
          # This is the check that was missing when `_people` shipped a LIMIT on
          # an unparenthesised UNION arm (0e9a614): the people group returned []
          # on every search for eight weeks, and because a group with no rows is
          # omitted from the payload entirely, nothing above could see it.
          curl -s -o /dev/null "http://localhost:8581/get/search?q=smith"
          curl -s -o /dev/null "http://localhost:8581/get/search/suggest?q=smith"
          if docker compose logs api | grep -E 'ERROR \[routers\.search\]'; then
            echo "::error::a federated-search query is malformed — see the line above"
            exit 1
          fi
          echo "search SQL OK — no malformed query in any group"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v

  # ── Job 3: Read-only smoke against PRODUCTION ───────────────
  # Prod deploys are a manual `git pull` on the box; run this (manually via
  # the Actions tab, or after a deploy) to confirm prod is serving.
  # Read-only GET journeys only.
  prod-smoke:
    name: Prod Read-only Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install chromium --with-deps
      - name: Run read-only E2E against prod
        run: BASE_URL=https://databook.nyc npx playwright test

  # ── Job 4 (MCP tool audit) MOVED to .github/workflows/mcp-tool-audit.yml ──
  # It lived here gated `if: github.event_name == 'workflow_dispatch'`, so it
  # printed "skipping" on every PR and had never run on its own — which is how
  # the MCP server stayed 502 for 16.5 hours on 2026-08-18 with the check that
  # was written to catch it switched off. It is now a DAILY scheduled workflow
  # with its own file, and it is not duplicated here: one definition, so a fix
  # to the audit cannot land in a copy nobody runs.
